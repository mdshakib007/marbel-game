<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Marbel: a glass cat's-eye marble with a golden vane -->
  <defs>
    <radialGradient id="glass" cx="36%" cy="30%" r="72%">
      <stop offset="0" stop-color="#ff9d8c"/>
      <stop offset="0.35" stop-color="#e8463a"/>
      <stop offset="0.8" stop-color="#9c1c14"/>
      <stop offset="1" stop-color="#4a0b07"/>
    </radialGradient>
    <linearGradient id="vane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe58a"/>
      <stop offset="0.5" stop-color="#f2c230"/>
      <stop offset="1" stop-color="#c98a0e"/>
    </linearGradient>
    <radialGradient id="shine" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ball"><circle cx="32" cy="32" r="29"/></clipPath>
  </defs>
  <!-- contact shadow -->
  <ellipse cx="33" cy="58" rx="20" ry="4.5" fill="#000" opacity="0.28"/>
  <!-- glass body -->
  <circle cx="32" cy="32" r="29" fill="url(#glass)"/>
  <!-- the cat's eye: a twisted golden vane with a pale core -->
  <g clip-path="url(#ball)">
    <path d="M6 44 C 18 30, 28 44, 40 26 S 56 12, 60 10 L 60 20 C 52 24, 46 40, 34 42 S 16 38, 8 52 Z" fill="url(#vane)" opacity="0.95"/>
    <path d="M10 46 C 20 36, 30 42, 40 30 S 54 16, 58 14" fill="none" stroke="#fff6d0" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
  </g>
  <!-- rim light and specular highlight -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="1.5"/>
  <ellipse cx="22" cy="19" rx="8" ry="5.5" fill="url(#shine)" transform="rotate(-30 22 19)"/>
  <circle cx="43" cy="46" r="2.2" fill="#fff" opacity="0.35"/>
</svg>
