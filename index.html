<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Marbel — the cave game</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <!-- In-game HUD -->
    <div id="hud" class="hud hidden">
      <div class="top-bar">
        <div class="player-card" id="card-0">
          <span class="marble-icon"></span>
          <span class="card-text">
            <span class="name">You</span>
            <span class="status"></span>
          </span>
          <span class="score">0</span>
          <span class="badge power" data-i18n="hud.power" data-i18n-title="hud.powerTitle">POWER</span>
        </div>
        <div class="player-card right" id="card-1">
          <span class="badge power" data-i18n="hud.power" data-i18n-title="hud.powerTitle">POWER</span>
          <span class="score">0</span>
          <span class="card-text">
            <span class="name">Computer</span>
            <span class="status"></span>
          </span>
          <span class="marble-icon"></span>
        </div>
      </div>

      <div class="side-buttons">
        <button id="btn-top" data-i18n-title="hud.topView" title="Top view (T)">
          <svg viewBox="0 0 24 24" width="22" height="22"><rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9" r="2" fill="currentColor"/><line x1="7" y1="18" x2="17" y2="18" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button id="btn-sound" data-i18n-title="hud.sound" title="Sound (M)">
          <svg id="icon-sound-on" viewBox="0 0 24 24" width="22" height="22"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8a4 4 0 010 8M18.5 5.5a8 8 0 010 13" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <svg id="icon-sound-off" viewBox="0 0 24 24" width="22" height="22" class="hidden"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button id="btn-menu" data-i18n-title="hud.menu" title="Menu (Esc)">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="bottom-bar">
        <div class="hint" id="hint"></div>
        <div class="power-wrap" id="power-wrap">
          <div class="power-meter"><div class="power-fill" id="power-fill"></div></div>
          <span class="power-label" id="power-label">Weak flick</span>
        </div>
        <div class="controls-row">
          <div class="slider-wrap hidden" id="elevation-wrap">
            <label for="elev"><span data-i18n="hud.lobAngle">Lob angle</span> <b id="elev-val">45°</b></label>
            <input type="range" id="elev" min="15" max="70" value="45" />
          </div>
          <div class="slider-wrap hidden" id="handx-wrap">
            <label for="handx"><span data-i18n="hud.linePos">Position on the line</span></label>
            <input type="range" id="handx" min="-1" max="1" step="0.01" value="-0.12" />
          </div>
        </div>
      </div>

      <div id="toasts" class="toasts"></div>
      <div id="thinking" class="thinking hidden"><span class="dot"></span> <span data-i18n="hud.thinking">Computer is thinking…</span></div>
      <div id="minimap-label" class="minimap-label" data-i18n="hud.overhead">overhead</div>
    </div>

    <!-- Setup -->
    <div id="setup" class="overlay">
      <div class="panel setup-panel">
        <div class="setup-head">
          <h1 data-i18n="setup.title">Marbel</h1>
          <div class="lang-switch" data-lang-switch>
            <button type="button" data-lang="en" data-i18n="lang.en">English</button>
            <button type="button" data-lang="bn" data-i18n="lang.bn">বাংলা</button>
          </div>
        </div>

        <div class="field inline">
          <label for="name" data-i18n="setup.name">Your name</label>
          <input type="text" id="name" maxlength="14" value="You" />
        </div>

        <div class="field">
          <label data-i18n="setup.size">Marble size</label>
          <div class="choices" id="size-choices"></div>
        </div>

        <div class="field">
          <label data-i18n="setup.style">Marble style</label>
          <div class="choices" id="style-choices"></div>
        </div>

        <div class="field">
          <label data-i18n="setup.colour">Colour</label>
          <div class="swatches" id="color-choices"></div>
        </div>

        <div class="field">
          <label data-i18n="setup.opponent">Computer opponent</label>
          <div class="choices" id="level-choices"></div>
        </div>

        <div class="field">
          <label data-i18n="setup.end">Game end</label>
          <div class="choices">
            <label class="choice"><input type="radio" name="mode" value="fun" checked /> <span data-i18n="setup.fun">Just for fun</span></label>
            <label class="choice"><input type="radio" name="mode" value="target" /> <span><span data-i18n="setup.target">First to</span> <input type="number" id="target" min="1" max="99" value="10" /> <span data-i18n="setup.targetNote">points</span></span></label>
          </div>
        </div>

        <div class="field inline">
          <label for="seed" data-i18n="setup.yard">Yard surface</label>
          <input type="number" id="seed" min="1" max="99999" value="7" />
          <button type="button" id="seed-random" class="small" data-i18n="setup.newYard">New yard</button>
        </div>

        <button id="btn-start" class="primary" data-i18n="setup.start">Start game</button>
      </div>
    </div>

    <!-- Pause menu -->
    <div id="menu" class="overlay hidden">
      <div class="panel">
        <div class="lang-switch" data-lang-switch>
          <button type="button" data-lang="en" data-i18n="lang.en">English</button>
          <button type="button" data-lang="bn" data-i18n="lang.bn">বাংলা</button>
        </div>
        <h2 data-i18n="menu.paused">Paused</h2>
        <p class="sub" id="menu-mode"></p>
        <div class="rules">
          <h3 data-i18n="menu.how">How to play</h3>
          <ol>
            <li data-i18n="menu.rule1"></li>
            <li data-i18n="menu.rule2"></li>
            <li data-i18n="menu.rule3"></li>
            <li data-i18n="menu.rule4"></li>
            <li data-i18n="menu.rule5"></li>
            <li data-i18n="menu.rule6"></li>
          </ol>
        </div>
        <div class="row">
          <button id="btn-resume" class="primary" data-i18n="menu.resume">Resume</button>
          <button id="btn-endgame" data-i18n="menu.end">End game</button>
          <button id="btn-newgame" data-i18n="menu.new">New game</button>
        </div>
      </div>
    </div>

    <!-- Game over -->
    <div id="over" class="overlay hidden">
      <div class="panel">
        <h2 id="over-title">Game over</h2>
        <p id="over-sub"></p>
        <table class="results" id="over-table"></table>
        <div class="row">
          <button id="btn-rematch" class="primary" data-i18n="over.rematch">Rematch</button>
          <button id="btn-over-new" data-i18n="over.new">New game</button>
        </div>
      </div>
    </div>

    <!-- Debug panel (?debug=1) -->
    <div id="debug" class="debug hidden">
      <b>debug</b>
      <button id="dbg-break">break on next hit</button>
      <button id="dbg-near">both near cave</button>
      <button id="dbg-power">give me power</button>
      <button id="dbg-autoplay">autoplay (AI vs AI)</button>
      <button id="dbg-slow">slow-mo</button>
      <pre id="dbg-out"></pre>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
